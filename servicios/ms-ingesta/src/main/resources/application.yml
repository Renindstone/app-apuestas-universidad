server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-ingesta
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5441}/ingesta_db
    username: ${POSTGRES_USER:apuestas}
    password: ${POSTGRES_PASSWORD:apuestas_dev}
  jpa:
    hibernate:
      ddl-auto: update        # suficiente para una semana; en producción se usaría Flyway
      # Respeta los nombres de columna tal cual (EjeIdEjecucion), sin pasarlos a eje_id_ejecucion.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # Pone comillas a los nombres para que PostgreSQL guarde las mayúsculas de la convención.
        globally_quoted_identifiers: true
        # Pero no a los tipos de columnDefinition: "text" entre comillas no existe en H2.
        globally_quoted_identifiers_skip_column_definitions: true
    open-in-view: false

ingesta:
  url-base: ${INGESTA_URL_BASE:https://football-data.co.uk}
  temporada-actual: "2627"
  temporada-anterior: "2526"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Se registra con su IP y no con el nombre de la máquina (en Docker, ese nombre es un id al azar).
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
