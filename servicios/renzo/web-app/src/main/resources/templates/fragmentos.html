<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Piezas comunes de todas las páginas: <head>, encabezado con el menú, avisos y pie. -->

<!-- <head>: Bootstrap 5 como base y encima la hoja propia, que es corta. -->
<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5" th:if="${enCurso}">
  <title th:text="${titulo} + ' | Apuestas'">Apuestas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<!-- Encabezado: marca, menú y usuario con su banca. La sección activa va subrayada. -->
<header th:fragment="cabecera(activo)" class="bg-white border-bottom mb-4">
  <div class="container d-flex flex-wrap align-items-center column-gap-4 py-2">
    <a class="fw-bold text-decoration-none" th:href="@{/}">Apuestas</a>
    <nav class="nav column-gap-3 flex-grow-1" aria-label="Secciones">
      <a th:replace="~{fragmentos :: enlace(${activo}, 'hoy', '/', 'Hoy')}"></a>
      <a th:replace="~{fragmentos :: enlace(${activo}, 'misApuestas', '/mis-apuestas', 'Mis apuestas')}"></a>
      <a th:replace="~{fragmentos :: enlace(${activo}, 'historial', '/historial', 'Historial')}"></a>
      <a th:replace="~{fragmentos :: enlace(${activo}, 'perfil', '/perfil', 'Perfil')}"></a>
      <!-- La ingesta solo aparece para el ADMIN (RN-WEB-06). -->
      <th:block th:if="${@sesionUsuario.esAdmin()}"><a th:replace="~{fragmentos :: enlace(${activo}, 'admin', '/admin/ingesta', 'Ingesta')}"></a></th:block>
    </nav>
    <form class="d-flex align-items-center gap-2 small m-0" th:action="@{/salir}" method="post">
      <span class="text-secondary"><span th:text="${@sesionUsuario.nombreUsuario}">renzo</span><span th:if="${@sesionUsuario.banca != null}"
            th:text="', banca ' + ${@fmt.soles(@sesionUsuario.banca)}">, banca S/ 500.00</span></span>
      <button class="btn btn-sm btn-outline-secondary" type="submit">Salir</button>
    </form>
  </div>
</header>

<!-- Un enlace del menú. -->
<a th:fragment="enlace(activo, clave, ruta, texto)" class="nav-link" th:classappend="${activo == clave} ? 'active'"
   th:href="@{${ruta}}" th:attr="aria-current=${activo == clave} ? 'page'" th:text="${texto}">Hoy</a>

<!-- Aviso que llega después de una acción (por ejemplo, «Apuesta registrada»). -->
<div th:fragment="avisos" class="container" th:if="${aviso != null}">
  <p class="alert alert-info py-2" role="status" th:text="${aviso}">Aviso</p>
</div>

<!-- Pie: juego responsable (RN-WEB-07) y honestidad sobre el modelo (RN-15). -->
<footer th:fragment="pie" class="container small text-secondary border-top mt-4 py-3">
  <p class="mb-1"><strong class="text-body">Solo para mayores de 18 años. Juega con responsabilidad.</strong></p>
  <p class="mb-0">Las probabilidades salen de un modelo de Poisson didáctico. Sirven para aprender y comparar, no garantizan ganancias.</p>
</footer>

<!-- Opciones de selección agrupadas por mercado. Recibe los nombres de los equipos para el 1X2. -->
<th:block th:fragment="opciones(local, visitante)">
  <optgroup th:each="grupo : ${opciones}" th:label="${grupo.key}">
    <option th:each="o : ${grupo.value}" th:value="${o.clave()}" th:text="${@fmt.etiqueta(o, local, visitante)}">Más de 2.5 goles</option>
  </optgroup>
</th:block>

</html>
