<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Piezas comunes de todas las páginas: <head>, encabezado con el menú, avisos y pie. -->

<!-- <head>: Bootstrap 5 como base (reinicio de estilos y utilidades) y encima la hoja del cuaderno. -->
<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5" th:if="${enCurso}">
  <title th:text="${titulo} + ' | Cuaderno de apuestas'">Cuaderno de apuestas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Caveat:wght@500;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/cuaderno.css}">
  <!-- Va en el <head> y sin defer: tiene que escuchar la transición antes de que se pinte la página. -->
  <script th:src="@{/js/transiciones.js}"></script>
</head>

<!-- Encabezado de la hoja: marca, usuario con su banca, botón de salir y menú.
     La sección activa lleva un círculo hecho a mano que se desliza al cambiar de pantalla. -->
<header th:fragment="cabecera(activo)" class="bloque cabecera">
  <div class="margen"><p class="mano" th:text="'Hoja del ' + ${@fmt.fechaCorta(@fmt.hoy())}">Hoja del 24 oct</p></div>
  <div class="cuerpo cabecera-cuerpo">
    <a class="marca" th:href="@{/}">Cuaderno de apuestas</a>
    <form class="usuario" th:action="@{/salir}" method="post">
      <span th:text="${@sesionUsuario.nombreUsuario}">renzo</span><span th:if="${@sesionUsuario.banca != null}"
            th:text="', banca ' + ${@fmt.soles(@sesionUsuario.banca)}">, banca S/ 500.00</span>
      <button class="enlace" type="submit">Salir</button>
    </form>
    <nav class="menu" aria-label="Secciones">
      <a th:replace="~{fragmentos :: enlace(${activo}, 'hoy', '/', 'Hoy')}"></a>
      <a th:replace="~{fragmentos :: enlace(${activo}, 'misApuestas', '/mis-apuestas', 'Mis apuestas')}"></a>
      <a th:replace="~{fragmentos :: enlace(${activo}, 'historial', '/historial', 'Historial')}"></a>
      <a th:replace="~{fragmentos :: enlace(${activo}, 'perfil', '/perfil', 'Perfil')}"></a>
      <!-- La ingesta solo aparece para el ADMIN (RN-WEB-06). -->
      <th:block th:if="${@sesionUsuario.esAdmin()}"><a th:replace="~{fragmentos :: enlace(${activo}, 'admin', '/admin/ingesta', 'Ingesta')}"></a></th:block>
    </nav>
  </div>
</header>

<!-- Un enlace del menú. Si es la sección activa, lleva el círculo a mano (view-transition-name: indicador). -->
<a th:fragment="enlace(activo, clave, ruta, texto)" th:href="@{${ruta}}" th:attr="aria-current=${activo == clave} ? 'page'">
  <span th:text="${texto}">Hoy</span><svg th:if="${activo == clave}" class="vt-indicador" viewBox="0 0 120 46"
       preserveAspectRatio="none" aria-hidden="true"><path d="M10 24 C 8 10, 46 3, 88 5 C 112 7, 119 19, 111 31 C 101 43, 34 45, 13 37 C 4 33, 3 23, 16 14" vector-effect="non-scaling-stroke"></path></svg>
</a>

<!-- Aviso que llega después de una acción (por ejemplo, «Apuesta registrada»). -->
<section th:fragment="avisos" class="bloque" th:if="${aviso != null}">
  <div class="margen"></div>
  <div class="cuerpo"><p class="aviso" role="status" th:text="${aviso}">Aviso</p></div>
</section>

<!-- Pie: juego responsable (RN-WEB-07) y honestidad sobre el modelo (RN-15). -->
<section th:fragment="pie" class="bloque bloque-pie">
  <div class="margen"><p class="mano">Importante</p></div>
  <div class="cuerpo">
    <footer class="pie">
      <p><strong>Solo para mayores de 18 años. Juega con responsabilidad.</strong></p>
      <p>Las probabilidades salen de un modelo de Poisson didáctico. Sirven para aprender y comparar, no garantizan ganancias.</p>
    </footer>
  </div>
</section>

<!-- Opciones de selección agrupadas por mercado. Recibe los nombres de los equipos para el 1X2. -->
<th:block th:fragment="opciones(local, visitante)">
  <optgroup th:each="grupo : ${opciones}" th:label="${grupo.key}">
    <option th:each="o : ${grupo.value}" th:value="${o.clave()}" th:text="${@fmt.etiqueta(o, local, visitante)}">Más de 2.5 goles</option>
  </optgroup>
</th:block>

</html>
