<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- /perfil: datos de la cuenta y la banca (la web no mueve dinero real, RN-USU-06). -->
<head th:replace="~{fragmentos :: head('Perfil')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecera('perfil')}"></header>
<div th:replace="~{fragmentos :: avisos}"></div>
<main class="container">
  <section class="mb-4">
    <h1 class="h3">Perfil</h1>
    <p class="small text-secondary">La web no mueve dinero real.</p>
    <p class="alert alert-warning py-2" role="status" th:if="${usuario == null}">Tu perfil no está disponible por ahora.</p>
    <dl class="cuentas" th:if="${usuario != null}">
      <dt>Usuario</dt><dd th:text="${usuario.nombreUsuario()}">renzo</dd>
      <dt>Correo</dt><dd th:text="${usuario.email()}">renzo@correo.pe</dd>
      <dt>Rol</dt><dd th:text="${usuario.rol() == 'ADMIN'} ? 'Administrador' : 'Apostador'">Apostador</dd>
      <th:block th:if="${pick != null}">
        <dt>Stake de hoy</dt>
        <dd><th:block th:text="|${@fmt.pct(pick.stakePct())} de ${@fmt.soles(usuario.banca())} = |"></th:block><mark th:text="${@fmt.stakeSoles(pick.stakePct(), usuario.banca())}">S/ 7.00</mark></dd>
      </th:block>
    </dl>
  </section>

  <section class="mb-4">
    <h2 class="h5">Mi banca</h2>
    <form class="row g-2 align-items-end" th:action="@{/perfil/banca}" th:object="${bancaForm}" method="post" novalidate>
      <div class="col-8 col-md-3"><label class="form-label small mb-1" for="banca">Banca en soles (mayor o igual a 0)</label>
        <input class="form-control" id="banca" th:field="*{banca}" inputmode="decimal"></div>
      <div class="col-4 col-md-2"><button class="btn btn-primary w-100" type="submit">Guardar</button></div>
      <p class="alert alert-danger py-2 mb-0 col-12" role="alert" th:if="${#fields.hasAnyErrors()}" th:text="${#fields.allErrors()[0]}">Error</p>
    </form>
  </section>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
