<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Página que usa Spring Boot para cualquier error que llegue hasta el final (por ejemplo, una ruta que no existe). -->
<head th:replace="~{fragmentos :: head('No encontrado')}"></head>
<body>
<main class="container py-5">
  <p class="small mb-1"><a th:href="@{/}">← Volver a Hoy</a></p>
  <h1 class="h3" th:text="${status == 404} ? 'Esta página no existe' : 'Algo no salió bien'">Esta página no existe</h1>
  <p class="lead" th:text="${status == 404} ? 'Revisa la dirección o vuelve a Hoy.' : 'Intenta de nuevo en unos minutos. Si sigue pasando, avísale al equipo.'">Revisa la dirección.</p>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
