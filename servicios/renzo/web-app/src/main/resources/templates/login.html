<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- /login: inicio de sesión. -->
<head th:replace="~{fragmentos :: head('Iniciar sesión')}"></head>
<body>
<div th:replace="~{fragmentos :: avisos}"></div>
<main class="container py-5" style="max-width: 440px">
  <div class="text-center mb-3">
    <img th:src="@{/img/logo.png}" alt="Logo Apuestas" class="img-fluid mb-2" style="max-width: 140px; height: auto;">
    <h1 class="h3 mb-1">Apuestas</h1>
    <p class="text-secondary">Cada probabilidad viene con su cuenta, para que sepas de dónde sale antes de decidir.</p>
  </div>
  <ul class="nav nav-tabs mb-3 gap-2 justify-content-center">
    <li class="nav-item"><a class="nav-link px-3 active" th:href="@{/login}" aria-current="page">Iniciar sesión</a></li>
    <li class="nav-item"><a class="nav-link px-3" th:href="@{/registro}">Crear cuenta</a></li>
  </ul>
  <form th:action="@{/login}" th:object="${form}" method="post" novalidate>
    <div class="mb-3"><label class="form-label" for="nombreUsuario">Usuario</label>
      <input class="form-control" id="nombreUsuario" th:field="*{nombreUsuario}" autocomplete="username" autofocus></div>
    <div class="mb-3"><label class="form-label" for="clave">Contraseña</label>
      <input class="form-control" id="clave" type="password" th:field="*{clave}" autocomplete="current-password"></div>
    <p class="alert alert-danger py-2" role="alert" th:if="${#fields.hasAnyErrors()}" th:text="${#fields.allErrors()[0]}">Error</p>
    <button class="btn btn-primary w-100" type="submit">Entrar</button>
  </form>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
