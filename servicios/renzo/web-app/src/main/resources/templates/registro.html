<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- /registro: crear una cuenta. El rol lo asigna el servidor (siempre APOSTADOR). -->
<head th:replace="~{fragmentos :: head('Crear cuenta')}"></head>
<body>
<main class="container py-5" style="max-width: 440px">
  <h1 class="h3 mb-1">Apuestas</h1>
  <p class="text-secondary">Tus apuestas solo las ves tú.</p>
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <a class="nav-link d-inline-flex align-items-center" th:href="@{/login}">
        <img th:src="@{/img/logo.png}" alt="Logo" width="24" height="24" class="me-2" style="object-fit: contain;">
        <span>Iniciar sesión</span>
      </a>
    </li>
    <li class="nav-item"><a class="nav-link active" th:href="@{/registro}" aria-current="page">Crear cuenta</a></li>
  </ul>
  <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
    <div class="mb-3"><label class="form-label" for="nombreUsuario">Usuario</label>
      <input class="form-control" id="nombreUsuario" th:field="*{nombreUsuario}" maxlength="30" autocomplete="username"></div>
    <div class="mb-3"><label class="form-label" for="email">Correo</label>
      <input class="form-control" id="email" type="email" th:field="*{email}" autocomplete="email"></div>
    <div class="mb-3"><label class="form-label" for="clave">Contraseña</label>
      <input class="form-control" id="clave" type="password" th:field="*{clave}" autocomplete="new-password"></div>
    <div class="mb-3"><label class="form-label" for="claveConfirmacion">Repite la contraseña</label>
      <input class="form-control" id="claveConfirmacion" type="password" th:field="*{claveConfirmacion}" autocomplete="new-password"></div>
    <p class="alert alert-danger py-2" role="alert" th:if="${#fields.hasAnyErrors()}" th:text="${#fields.allErrors()[0]}">Error</p>
    <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
  </form>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
