<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Aviso genérico cuando una acción no se pudo completar. Nunca se muestra un error técnico (RN-WEB-04). -->
<head th:replace="~{fragmentos :: head(${titulo})}"></head>
<body>
<th:block th:if="${@sesionUsuario.estaAutenticado()}"><header th:replace="~{fragmentos :: cabecera('')}"></header></th:block>
<main class="container py-4">
  <p class="small mb-1"><a th:href="@{/}">← Volver a Hoy</a></p>
  <h1 class="h3" th:text="${titulo}">No disponible</h1>
  <p class="lead" th:text="${mensaje}">Un servicio no responde por ahora.</p>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
