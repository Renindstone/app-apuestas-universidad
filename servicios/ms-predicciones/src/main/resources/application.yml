server:
  port: ${PORT:8086}

spring:
  application:
    name: ms-predicciones

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Se registra con su IP y no con el nombre de la máquina (en Docker, ese nombre es un id al azar).
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
